version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: smart_trash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/smart_trash
      SECRET_KEY: your-secret-key-here
      JWT_SECRET: your-jwt-secret-here
      CORS_ORIGINS: http://localhost:4200
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["./start.sh"]

volumes:
  postgres_data: